trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/main.tf
      - terraform/modules/**
      - terraform/dev.tfvars
      - terraform/prod.tfvars

variables:
  terraformVersion: '3.0.0'
  tfWorkingDirectory: './terraform'
  storageAccountName: 'yourstorageaccount'
  containerName: 'yourcontainer'
  localTfvarsPath: '$(Pipeline.Workspace)/env.tfvars'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: DetectEnvironment
    displayName: 'Detect Environment from Changes'
    jobs:
      - job: Detect
        steps:
          - checkout: self
          - bash: |
              echo "Detecting environment from changed files..."
              git diff --name-only origin/main...HEAD > changes.txt
              if grep -q "dev.tfvars" changes.txt; then
                echo "##vso[task.setvariable variable=environment]dev"
                echo "##vso[task.setvariable variable=blobName]dev.tfvars"
              elif grep -q "prod.tfvars" changes.txt; then
                echo "##vso[task.setvariable variable=environment]prod"
                echo "##vso[task.setvariable variable=blobName]prod.tfvars"
              else
                echo "No environment-specific tfvars file changed. Skipping deployment."
                echo "##vso[task.setvariable variable=skipDeployment]true"
            displayName: 'Set Environment Variables'

  - stage: DeployTerraform
    displayName: 'Deploy Terraform'
    dependsOn: DetectEnvironment
    condition: ne(variables['skipDeployment'], 'true')
    jobs:
      - job: Deploy
        displayName: 'Deploy to $(environment)'
        steps:
          - task: AzureCLI@2
            displayName: 'Download tfvars from Blob Storage'
            inputs:
              azureSubscription: 'Terraform-ADO-BuildDeploy'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Downloading $(blobName) from blob storage..."
                az storage blob download \
                  --account-name $(storageAccountName) \
                  --container-name $(containerName) \
                  --name $(blobName) \
                  --file $(localTfvarsPath) \
                  --auth-mode login

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - bash: |
              echo "Running Terraform for $(environment)..."
              cd $(tfWorkingDirectory)
              terraform init -input=false
              terraform plan -var-file=$(localTfvarsPath) -out=tfplan -input=false
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Plan and Apply'
